# The gbot.prod01 instance (GBot#6890) — the bot real users talk to. scripts/deploy.sh and
# scripts/deploy-watcher.sh operate on this file, and scripts/qa.sh uses it for `up prod`.
#
# One compose file per instance, each naming its own env file outright: this one is prod's, and
# docker-compose-dev.yml is dev's. Both run on the Pi at once. The rule is one token in exactly
# one place — to work on this identity locally, stop it on the Pi first and put it back after.
services:

  gbot-8.0-prod:
    container_name: "GBot_8.0_prod"
    image: ghcr.io/cgoulart35/gbot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./Dockerfile
      target: prod
    env_file: ./Shared/gbot.env
    volumes:
      - ./Shared/serviceAccountKey.json:/GBot/Shared/serviceAccountKey.json
    restart: unless-stopped
    init: true
    ports:
      - 5004:5004
