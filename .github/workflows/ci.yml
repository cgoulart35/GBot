name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  changes:                       # flag doc/CI-only pushes (md, .claude/, .github/) so we can skip publish for them
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        name: Did anything outside docs/CI config change?
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" | grep -qvE '(\.md$|^\.claude/|^\.github/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit==2.10.0
      - name: Audit runtime dependencies (advisory)
        run: pip-audit -r requirements.txt

  publish:
    needs: [test, changes]
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm        # free native arm64 for public repos (no QEMU)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build & push bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/cgoulart35/gbot:latest
            ghcr.io/cgoulart35/gbot:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
